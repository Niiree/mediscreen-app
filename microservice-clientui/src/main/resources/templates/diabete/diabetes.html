<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
	<meta charset="UTF-8">
	<title>Diabetes Risk</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
	<style>
		body { background:#f6f7fb; }
		.card { border:0; border-radius:1rem; box-shadow:0 10px 25px rgba(0,0,0,.06); }
		.kv { font-size:.95rem; }
		.kv .key { color:#6c757d; min-width:120px; }
	</style>
</head>
<body>
<div class="container py-5">

	<div class="d-flex align-items-center mb-4">
		<h2 class="mb-0"><i class="bi bi-activity me-2"></i>Diabetes Risk</h2>
		<a th:href="@{./}" class="btn btn-outline-secondary btn-sm ms-auto">
			<i class="bi bi-arrow-left"></i> Back
		</a>
	</div>

	<div class="row g-4">
		<!-- Patient card -->
		<div class="col-12 col-lg-6">
			<div class="card p-4 h-100">
				<h5 class="mb-3"><i class="bi bi-person-badge me-2"></i>Patient</h5>
				<div class="kv d-flex mb-1">
					<div class="key me-2">Name</div>
					<div th:text="${patient.firstName} + ' ' + ${patient.lastName}">John Doe</div>
				</div>
				<div class="kv d-flex mb-1">
					<div class="key me-2">Birthdate</div>
					<div th:text="${#dates.format(patient.birthdate, 'dd/MM/yyyy')}">01/01/1980</div>
				</div>
				<div class="kv d-flex mb-1">
					<div class="key me-2">Gender</div>
					<div>
            <span class="badge"
				  th:classappend="${patient.gender}=='M' ? ' text-bg-primary' : ' text-bg-danger'"
				  th:text="${patient.gender}">M</span>
					</div>
				</div>
				<div class="kv d-flex mb-1" th:if="${patient.city}">
					<div class="key me-2">City</div>
					<div th:text="${patient.city}">Paris</div>
				</div>
			</div>
		</div>

		<!-- Result card -->
		<div class="col-12 col-lg-6">
			<div class="card p-4 h-100">
				<h5 class="mb-3"><i class="bi bi-clipboard2-pulse me-2"></i>Result</h5>

				<div class="mb-2">
					<span class="fw-semibold me-2">Risk level:</span>
					<span class="badge"
						  th:classappend="
                  ${riskLevel}=='EARLY_ONSET' ? ' text-bg-danger' :
                  (${riskLevel}=='IN_DANGER' ? ' text-bg-warning' :
                  (${riskLevel}=='BORDERLINE' ? ' text-bg-info' :
                  (${riskLevel}=='NONE' ? ' text-bg-success' : ' text-bg-secondary')))"
						  th:text="${#strings.replace(riskLevel, '_', ' ')}">N/A</span>
				</div>

				<div class="text-muted" th:text="${resultMessage}">No result</div>

				<div class="mt-4 d-flex gap-2">
					<a class="btn btn-outline-primary" th:href="@{notes/patient/{id}/(id=${patient.id})}">
						<i class="bi bi-journal-text"></i> View Notes
					</a>
					<a class="btn btn-outline-secondary" th:href="@{./}">
						<i class="bi bi-people-fill"></i> Patient List
					</a>
				</div>
			</div>
		</div>
	</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
