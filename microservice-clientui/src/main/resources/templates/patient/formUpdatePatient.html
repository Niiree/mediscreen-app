<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
	<meta charset="utf-8"/>
	<title>Update Patient</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
	<style>
		body { background:#f6f7fb; }
		.card { border:0; border-radius:1rem; box-shadow:0 10px 25px rgba(0,0,0,.06); }
		.form-label .required { color:#dc3545; }
	</style>
</head>
<body>
<div class="container py-5">
	<div class="row justify-content-center">
		<div class="col-12 col-lg-8">
			<div class="d-flex align-items-center mb-4">
				<h2 class="mb-0"><i class="bi bi-person-lines-fill me-2"></i>Update Patient</h2>
				<a th:href="@{./}" class="btn btn-outline-secondary btn-sm ms-auto">
					<i class="bi bi-arrow-left"></i> Back
				</a>
			</div>

			<div class="card p-4">
				<form th:action="@{patient/update/{id}(id=${patientBean.id})}" th:object="${patientBean}" method="post" novalidate>
					<input type="hidden" th:field="*{id}"/>

					<div class="row g-3">
						<div class="col-md-6">
							<label for="firstName" class="form-label">First Name <span class="required">*</span></label>
							<input id="firstName" th:field="*{firstName}" type="text" class="form-control" placeholder="John" th:errorclass="is-invalid" required>
							<div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
						</div>

						<div class="col-md-6">
							<label for="lastName" class="form-label">Last Name <span class="required">*</span></label>
							<input id="lastName" th:field="*{lastName}" type="text" class="form-control" placeholder="Doe" th:errorclass="is-invalid" required>
							<div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
						</div>

						<div class="col-md-6">
							<label for="birthdate" class="form-label">Birthdate <span class="required">*</span></label>
							<input id="birthdate" th:field="*{birthdate}" type="date" class="form-control" th:errorclass="is-invalid" required>
							<div class="invalid-feedback" th:if="${#fields.hasErrors('birthdate')}" th:errors="*{birthdate}"></div>
						</div>

						<div class="col-md-6">
							<label for="gender" class="form-label">Gender <span class="required">*</span></label>
							<select id="gender" th:field="*{gender}" class="form-select" th:errorclass="is-invalid" required>
								<option value="" disabled>-- Select Gender --</option>
								<option value="M">M</option>
								<option value="F">F</option>
							</select>
							<div class="invalid-feedback" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
						</div>

						<div class="col-md-6">
							<label for="city" class="form-label">City</label>
							<input id="city" th:field="*{city}" type="text" class="form-control" placeholder="Paris" th:errorclass="is-invalid">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
						</div>

						<div class="col-md-6">
							<label for="address" class="form-label">Address</label>
							<input id="address" th:field="*{address}" type="text" class="form-control" placeholder="10 Rue Exemple" th:errorclass="is-invalid">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
						</div>

						<div class="col-md-6">
							<label for="postalCode" class="form-label">Postal Code</label>
							<input id="postalCode" th:field="*{postalCode}" type="text" class="form-control" placeholder="75001" inputmode="numeric" pattern="\\d{4,10}" th:errorclass="is-invalid">
							<div class="form-text">Digits only (4–10).</div>
							<div class="invalid-feedback" th:if="${#fields.hasErrors('postalCode')}" th:errors="*{postalCode}"></div>
						</div>

						<div class="col-md-6">
							<label for="phoneNumber" class="form-label">Phone Number</label>
							<input id="phoneNumber" th:field="*{phoneNumber}" type="tel" class="form-control" placeholder="+33 6 12 34 56 78" inputmode="tel" pattern="^[0-9+().\\s-]{6,20}$" th:errorclass="is-invalid">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
						</div>
					</div>

					<div class="d-flex gap-2 justify-content-end mt-4">
						<a class="btn btn-outline-secondary" th:href="@{./}">
							<i class="bi bi-x-circle"></i> Cancel
						</a>
						<button type="submit" class="btn btn-primary">
							<i class="bi bi-save"></i> Update Patient
						</button>
					</div>
				</form>
			</div>

		</div>
	</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
