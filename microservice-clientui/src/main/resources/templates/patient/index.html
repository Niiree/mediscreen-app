<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
	<meta charset="UTF-8">
	<title>Patients</title>

	<!-- Bootstrap 5 + Icons -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

	<style>
		body { background: #f6f7fb; }
		.card { border: 0; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,.06); }
		.table thead th { white-space: nowrap; }
	</style>

	<base th:href="@{/}">
</head>
<body>
<div class="container py-5">

	<!-- Header -->
	<div class="d-flex align-items-center mb-4">
		<h2 class="mb-0"><i class="bi bi-people-fill me-2"></i>Patient List</h2>
		<a th:href="@{patient/add}" class="btn btn-primary ms-auto">
			<i class="bi bi-plus-circle"></i> Add New Patient
		</a>
	</div>

	<!-- Table card -->
	<div class="card p-3">
		<div class="table-responsive">
			<table class="table table-hover table-striped align-middle mb-0">
				<thead class="table-light">
				<tr>
					<th>Id</th>
					<th>First name</th>
					<th>Last name</th>
					<th>Birthdate</th>
					<th>Gender</th>
					<th>City</th>
					<th>Address</th>
					<th>Postal code</th>
					<th>Phone</th>
					<th class="text-end">Actions</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="patient : ${patients}">
					<td th:text="${patient.id}">1</td>
					<td th:text="${patient.firstName}">John</td>
					<td th:text="${patient.lastName}">Doe</td>
					<td th:text="${#dates.format(patient.birthdate, 'dd/MM/yyyy')}">01/01/1980</td>
					<td>
						<span class="badge"
							  th:classappend="${patient.gender}=='M' ? ' text-bg-primary' : ' text-bg-danger'"
							  th:text="${patient.gender}">M</span>
					</td>
					<td th:text="${patient.city}">Paris</td>
					<td th:text="${patient.address}">10 Rue Exemple</td>
					<td th:text="${patient.postalCode}">75001</td>
					<td th:text="${patient.phoneNumber}">+33 6 12 34 56 78</td>

					<td class="text-end text-nowrap">
						<div class="btn-group" role="group" aria-label="Actions">
							<a th:href="@{patient/update/{id}(id=${patient.id})}" class="btn btn-outline-success">
								<i class="bi bi-pencil-square"></i> Edit
							</a>

							<form th:action="@{patient/delete/{id}(id=${patient.id})}"
								  method="post" class="d-inline"
								  onsubmit="return confirm('Delete this patient?');">
								<button type="submit" class="btn btn-outline-danger">
									<i class="bi bi-trash"></i> Delete
								</button>
							</form>

							<a th:href="@{notes/patient/{id}/(id=${patient.id})}" class="btn btn-outline-secondary">
								<i class="bi bi-journal-text"></i> Notes
							</a>

							<a th:href="@{patient/{id}/diabetes/getInfo(id=${patient.id})}" class="btn btn-outline-info">
								<i class="bi bi-activity"></i> Analyze
							</a>
						</div>
					</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
