<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
	<meta charset="UTF-8">
	<title>Notes</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
	<style>
		body { background:#f6f7fb; }
		.card { border:0; border-radius:1rem; box-shadow:0 10px 25px rgba(0,0,0,.06); }
	</style>
</head>
<body>
<div class="container py-5">

	<div class="d-flex align-items-center mb-4">
		<h2 class="mb-0">
			<i class="bi bi-journal-text me-2"></i>
			Notes for patient <span class="text-primary" th:text="${patientId}">ID</span>
		</h2>
		<div class="ms-auto d-flex gap-2">
			<a th:href="@{notes/patient/{id}/add(id=${patientId})}" class="btn btn-primary">
				<i class="bi bi-plus-circle"></i> Add Note
			</a>
			<a th:href="@{./}" class="btn btn-outline-secondary">
				<i class="bi bi-arrow-left"></i> Back
			</a>
		</div>
	</div>

	<div class="card p-3">
		<div class="table-responsive">
			<table class="table table-hover align-middle mb-0">
				<thead class="table-light">
				<tr>
					<th style="width:70%">Note</th>
					<th class="text-end">Actions</th>
				</tr>
				</thead>
				<tbody>
				<tr th:if="${#lists.isEmpty(notes)}">
					<td colspan="2" class="text-muted">No notes yet. Click “Add Note”.</td>
				</tr>
				<tr th:each="n : ${notes}">
					<td th:text="${n.comment}">comment</td>
					<td class="text-end text-nowrap">
						<a th:href="@{notes/patient/{pid}/{nid}/edit(pid=${patientId}, nid=${n.id})}" class="btn btn-outline-success btn-sm">
							<i class="bi bi-pencil-square"></i> Edit
						</a>
						<a th:href="@{notes/patient/{pid}/{nid}/delete(pid=${patientId}, nid=${n.id})}" class="btn btn-outline-danger btn-sm" onclick="return confirm('Delete this note?');">
							<i class="bi bi-trash"></i> Delete
						</a>
					</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
